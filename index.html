<!DOCTYPE html>
<html lang = "en">
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css?family=Inter:300,700" rel="stylesheet">
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
        <title>Graphing Calculator</title>
        <script src="calculator.js"></script>
    </head>
    <body>
        <h1 class="center-header text-white">Calculator by halhoff</h1>
        <div class="text-left">
            <h2>Examples of Inputs</h2>
            <ul>
                <li>Calculations: 1/2, 2^0.5, (1+2)*3</li>
                <li>Graphs: x, 2^x, 1/x</li>
            </ul>
        </div>
        <input type="text" id="expression" placeholder="Enter an expression" class="input-box">
        <p id="answer" class="result"></p>
        <div id="graph-canvas"></div>
        <script src="main.js"></script>
        <script src="calculator.js"></script>
        <script src="graphmodule.js"></script>
        <script>
            window.onload = function() {
                document.getElementById('expression').value = "";
            }
            function runOnEnter(event) {
                if (event.key === 'Enter') {
                    if (document.getElementById('expression').value.trim() !== "") {
                        equationOrExpression(document.getElementById('expression').value);
                    }
                }
            }
            document.getElementById('expression').addEventListener('keydown', runOnEnter);
        </script>
    </body>
</html>
